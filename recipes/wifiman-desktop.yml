# module for install wifiman-desktop
modules:
  - type: dnf
    repos:
      copr:
        enable:
          - name: coles/wifiman-desktop
            chroot: fedora-44-x86_64
    install:
      packages:
        - wifiman-desktop
  - type: systemd
    system:
      enabled:
        - wifiman-desktop.service
